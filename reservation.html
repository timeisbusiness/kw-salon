    <div class="reservation-container">
        <h1>Formulaire de Réservation</h1>
        <form>
            <label for="nom">Nom du client :</label>
            <input type="text" id="nom" name="nom" required title="nom">

            <label for="nom">Prénom du client :</label>
            <input type="text" id="prenom" name="prenom" required title="Prénom">

            <label for="numero">Numéro du client :</label>
            <input type="tel" id="numero" name="numero" pattern="(\+221)[0-9]{2}[0-9]{7}" required title="Le numéro doit commencer par +221 suivi de 9 chiffres. Exemple : +221 77 123 4567">

            <label for="date">Date de réservation :</label>
            <input type="date" id="date" name="date" required>

            <label for="heure">Heure de réservation :</label>
            <input type="time" id="heure" name="heure" required>

            <button type="submit">
                <a href="mailto:mouhamedalves1@gmail.com?subject=Réservation&body=Nom: ...%0ANuméro: ...%0ADate: ...%0AHeure: ...">
                    Réserver
                </a>
            </button>
            
        </form>
